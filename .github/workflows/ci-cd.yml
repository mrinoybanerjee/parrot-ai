name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: useblacksmith/checkout@4a338d9e78beb326c7222f0693507fe80bae37f2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m compileall -q backend frontend
      - run: pytest --cov=backend --cov=frontend --cov-report=term-missing
  containers:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: useblacksmith/checkout@4a338d9e78beb326c7222f0693507fe80bae37f2
      - uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184
        with:
          cache-key: parrot-ai-containers
      - name: Validate Compose and build images
        run: |
          docker compose config --quiet
          docker compose build backend frontend test
